name: Render Instagram staging media

on:
  push:
    paths:
      - 'sources/**.html'
      - 'sources/**.html.gz.b64'
      - 'sources/**.html.gz.b64.part*'
      - 'scripts/render_media.py'
      - '.github/workflows/render-media.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-media-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        run: python -m pip install --disable-pip-version-check weasyprint pymupdf pillow

      - name: Render and audit publication media
        run: python scripts/render_media.py

      - name: Commit deterministic JPEGs and manifests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed
          if git diff --cached --quiet; then
            echo 'No rendered changes to commit.'
          else
            git commit -m 'Render audited Instagram staging media'
            git push
          fi
